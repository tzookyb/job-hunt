<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Hunt</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/stages.css">
<link rel="stylesheet" href="css/detail.css">
<link rel="stylesheet" href="css/dialogs.css">
</head>
<body>
<header>
  <h1><img class="brand" src="favicon.svg" alt="">Job Hunt</h1>
  <div class="tools">
    <input id="q" type="search" placeholder="Search companies, roles, notes…  ( / )">
    <span id="count" class="muted"></span>
    <button class="btn" id="stagesBtn">Hiring Stages</button>
    <button class="btn primary" id="add">+ Add Company</button>
  </div>
  <span id="saveStatus"></span>
</header>
<main id="main"></main>

<dialog id="newDlg">
  <form>
    <div class="dlg-head"><h3>Add company</h3><button type="button" class="icon" id="newClose" title="Close">✕</button></div>
    <input id="newName" class="field" placeholder="Company name" autocomplete="off">
    <span class="hint">I’ll try to find the website, Glassdoor page and logo, then open the company.</span>
    <div class="row2"><button type="button" class="btn ghost" id="newCancel">Cancel</button><button class="btn primary">Add</button></div>
  </form>
</dialog>
<div id="loader" hidden><div class="ld-box"><div class="spin"></div><div id="ldText"></div><button class="btn ghost" id="ldSkip">Skip</button></div></div>

<dialog id="stagesDlg">
  <div class="dlg-head"><h3>Hiring Stages</h3><button class="icon" id="dlgClose" title="Close">✕</button></div>
  <p class="hint">Shared by all companies. New companies get this order, with only the switched-on stages turned on. Each company can reorder and switch stages on or off for itself.</p>
  <div id="gsList"></div>
  <div class="addstage"><input id="gsNew" class="newstage" placeholder="+ New stage — Enter to add"></div>
  <div class="dlg-foot"><button class="btn ghost" id="applyOrder">Apply this order to all companies</button></div>
</dialog>
<script type="module" src="js/main.js"></script>
</body>
</html>
