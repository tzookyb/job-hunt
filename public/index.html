<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Hunt</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/stages.css">
<link rel="stylesheet" href="css/detail.css">
<link rel="stylesheet" href="css/dialogs.css">
</head>
<body>
<header>
  <h1>Job Hunt</h1>
  <div class="tools">
    <input id="q" type="search" placeholder="Search companies, roles, notes…  ( / )">
    <span id="count" class="muted"></span>
    <button class="btn" id="stagesBtn">Stages</button>
    <button class="btn primary" id="add">+ Company</button>
  </div>
  <span id="saveStatus"></span>
</header>
<main id="main"></main>

<dialog id="stagesDlg">
  <div class="dlg-head"><h3>Stages</h3><button class="icon" id="dlgClose" title="Close">✕</button></div>
  <p class="hint">Shared by all companies. New companies get this order, with only the switched-on stages turned on. Each company can reorder and switch stages on or off for itself.</p>
  <div id="gsList"></div>
  <div class="addstage"><input id="gsNew" class="newstage" placeholder="+ New stage — Enter to add"></div>
  <div class="dlg-foot"><button class="btn ghost" id="applyOrder">Apply this order to all companies</button></div>
</dialog>
<script type="module" src="js/main.js"></script>
</body>
</html>
